<link rel="canonical" href="https://kiwi-crossing.com/">
<meta name="theme-color" content="#22584a">
<script>var BASE="/kiwi-crossing/",NEW="https://kiwi-crossing.com/";
function kcTarget(href){var u=new URL(href),p=u.pathname;p=p.indexOf(BASE)===0?p.slice(BASE.length):"";
p=(p==="privacy.html"||p==="privacy")?"privacy":"";return NEW+p+u.hash;}
(function(){var t=kcTarget(location.href);
try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(r.scope.indexOf(location.origin+BASE)===0)r.unregister();});});}catch(e){}
try{if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){if(/^ctd(glass)?-/.test(k))caches.delete(k);});});}catch(e){}
location.replace(t);})();</script>
